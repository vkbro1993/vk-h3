[package]
name = "h3-app"
version = "1.1.1"
description = "h3.c MiniMax-H3 本地视频生成 GUI"
authors = ["vkbro"]
edition = "2021"

[lib]
name = "h3_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
